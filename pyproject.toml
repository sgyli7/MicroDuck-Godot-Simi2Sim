[project]
name = "microduck-sim2sim"
version = "0.1.0"
description = "MuJoCo ↔ Godot/Jolt Sim2Sim toolchain (robot-agnostic; Microduck first)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.10.0",
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.scripts]
mjcf2godot = "mjcf2godot.convert:main"
sim2sim-runner = "sim2sim.runner:main"
sim2sim-calib = "sim2sim.calib:main"
sim2sim-compare = "sim2sim.compare:main"
sim2sim-spikes = "sim2sim.spikes:main"
sim2sim-play = "sim2sim.play:main"
sim2sim-kick-gate = "sim2sim.kick_gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim2sim", "mjcf2godot"]

[tool.hatch.build.targets.wheel.force-include]
"src/sim2sim" = "sim2sim"
"src/mjcf2godot" = "mjcf2godot"

[tool.hatch.build.targets.editable.force-include]
"src/sim2sim" = "sim2sim"
"src/mjcf2godot" = "mjcf2godot"

[tool.uv]
package = true
